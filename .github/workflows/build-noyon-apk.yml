name: Build NOYON APK

on:
  push:
    paths:
      - '.github/workflows/build-noyon-apk.yml'
      - 'NOYON-A-Android-Starter.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract Android project ZIP
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/noyohhg/Noyon/main/NOYON-A-Android-Starter.zip \
            -o project.zip
          mkdir extracted
          unzip -q project.zip -d extracted
          test -f extracted/NOYON-A/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Align Java and Kotlin JVM targets
        working-directory: extracted/NOYON-A
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
          s = s.replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17')
          p.write_text(s)
          # Force both Java and Kotlin compilation tasks to the same JVM target.
          p = Path('build.gradle.kts')
          root = p.read_text() if p.exists() else ''
          p.write_text(root + '\n\nallprojects {\n    tasks.withType<JavaCompile>().configureEach {\n        sourceCompatibility = "17"\n        targetCompatibility = "17"\n    }\n}\n')
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s += '\n\ntasks.withType<JavaCompile>().configureEach {\n    sourceCompatibility = "17"\n    targetCompatibility = "17"\n}\n'
          p.write_text(s)
          print('Forced Java compiler target to JVM 17.')
          PY

      - name: Build debug APK
        working-directory: extracted/NOYON-A
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOYON-A-debug-APK
          path: extracted/NOYON-A/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
